<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05070c" />
    <meta name="description" content="A 3D anatomy quiz: find every bone, muscle and organ in the human body." />
    <title>Body Quiz</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage"><canvas id="scene"></canvas></div>

    <div id="loading">
      <h1>Body Quiz</h1>
      <div class="bar"><div id="loading-bar"></div></div>
      <p id="loading-text">Loading the body…</p>
    </div>

    <section id="menu" class="panel" hidden>
      <h1>Body Quiz</h1>
      <p class="tagline">Find every bone, muscle and organ.</p>
      <h2>Mode</h2>
      <div id="modes" class="choices"></div>
      <h2>System</h2>
      <div id="systems" class="choices"></div>
      <div id="level-block">
        <h2>Level</h2>
        <div id="levels" class="choices"></div>
      </div>
      <button id="start" class="primary">Start</button>
      <p id="best" class="best"></p>
      <button id="open-scores" class="ghost">High scores</button>
      <p id="credit" class="credit"></p>
    </section>

    <div id="hud" hidden>
      <header id="top">
        <button id="quit" class="icon" aria-label="Back to the menu">✕</button>
        <div id="prompt"><small id="prompt-kind"></small><strong id="prompt-text"></strong></div>
        <form id="search" role="search" hidden>
          <input id="search-input" type="search" placeholder="Find a part: femur, liver…" autocomplete="off" spellcheck="false" aria-label="Find a part by name" aria-controls="search-results" />
        </form>
        <button id="find" class="icon" aria-label="Find a part by name" aria-expanded="false" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <div id="status"><span id="progress"></span><strong id="score"></strong></div>
      </header>
      <ul id="search-results" role="listbox" hidden></ul>
      <div id="tries"></div>
      <div id="toast" hidden></div>
      <div id="bottom">
        <div id="options" hidden></div>
        <div id="card" hidden>
          <div><strong id="card-name"></strong><small id="card-sub"></small></div>
          <div class="card-actions">
            <button id="card-focus">Isolate</button>
            <button id="card-hide">Hide</button>
          </div>
        </div>
        <div id="fact" hidden>
          <p id="fact-does"></p>
          <p id="fact-fun"></p>
        </div>
        <button id="next" class="primary" hidden>Next</button>
        <div id="tools">
          <button id="home" title="See the whole body">Whole body</button>
          <button id="peel" title="Tap parts to take them away" aria-pressed="false">Peel</button>
          <button id="restore" hidden>Put back</button>
          <button id="skip" hidden>Show me</button>
        </div>
        <nav id="layers" aria-label="Layers"></nav>
      </div>
    </div>

    <section id="summary" class="panel" hidden>
      <h1 id="summary-title"></h1>
      <p id="summary-score" class="big"></p>
      <p id="summary-best" class="best"></p>
      <div id="summary-scores"></div>
      <ol id="summary-list"></ol>
      <button id="again" class="primary">Play again</button>
      <button id="to-menu" class="ghost">Menu</button>
    </section>

    <section id="scores" class="panel" hidden>
      <h1>High scores</h1>
      <button id="scores-filter" aria-expanded="false" aria-controls="scores-filters"><span id="scores-round"></span><b>Filter</b></button>
      <div id="scores-filters" hidden>
        <h2>Mode</h2>
        <div id="scores-modes" class="choices"></div>
        <h2>System</h2>
        <div id="scores-systems" class="choices"></div>
        <h2>Level</h2>
        <div id="scores-levels" class="choices"></div>
      </div>
      <div id="scores-tables"></div>
      <button id="scores-back" class="ghost">Back</button>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
